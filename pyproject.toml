[project]
name = "mouse-seizure"
version = "0.1.0"
description = "Spike-wave discharge detection in mouse EEG: feature engineering, event formation, and event-level evaluation"
readme = "README.md"
authors = [
    { name = "Ethan Huffington" }
]
requires-python = ">=3.13"
dependencies = [
    "catboost>=1.2.10",
    "h5py>=3.16.0",
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "polars>=1.44.1",
    "pyarrow>=25.0.1",
    "pywavelets>=1.9.0",
    "requests>=2.34.2",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.1",
    "timescoring>=0.0.7",
    "torch>=2.14.0",
]

[project.scripts]
mouse-seizure = "mouse_seizure:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyter-client>=8.10.0",
    "nbconvert>=7.17.1",
    "nbformat>=5.11.1",
    "pydeps>=3.0.7",
    "pytest>=9.1.1",
]
